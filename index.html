<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dongseok Heo</title>
<style>
  :root {
    --bg: #faf8f6;
    --fg: #2b2622;
    --muted: #6f665e;
    --line: #e6e0d9;
    --accent: #7c5cd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917;
      --fg: #ece7e2;
      --muted: #a49a91;
      --line: #332e2a;
      --accent: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 12vh 24px 8vh;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 3rem; font-size: .95rem; }
  h2 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 0 0 1rem; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a.row {
    display: flex; align-items: baseline; gap: .75rem;
    padding: .9rem .25rem; text-decoration: none; color: var(--fg);
  }
  a.row:hover { color: var(--accent); }
  .name { font-weight: 500; }
  .note { color: var(--muted); font-size: .85rem; margin-left: auto; }
  footer { margin-top: 3.5rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Dongseok Heo</h1>
  <p class="sub">모바일 게임을 만듭니다.</p>

  <h2>앱</h2>
  <ul>
    <li>
      <a class="row" href="https://apps.apple.com/kr/app/id6787983526">
        <span class="name">캣챠!</span>
        <span class="note">App Store</span>
      </a>
    </li>
  </ul>

  <h2 style="margin-top:2.5rem">문서</h2>
  <ul>
    <li>
      <a class="row" href="https://heyzxyz.github.io/catcha-privacy/">
        <span class="name">개인정보처리방침</span>
        <span class="note">캣챠!</span>
      </a>
    </li>
    <li>
      <a class="row" href="https://heyzxyz.github.io/catcha-privacy/support/">
        <span class="name">지원 및 문의</span>
        <span class="note">캣챠!</span>
      </a>
    </li>
  </ul>

  <footer>© 2026 Dongseok Heo</footer>
</main>
</body>
</html>
